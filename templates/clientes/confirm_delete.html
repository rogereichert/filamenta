{% extends "base.html" %}
{% block header %}Excluir Cliente{% endblock %}
{% block subheader %}Ação irreversível{% endblock %}

{% block content %}
<div class="max-w-lg space-y-4">

  <div class="rounded-2xl border border-red-500/20 bg-red-600/10 p-5">
    <p class="text-slate-200">
      Você está prestes a excluir <strong>{{ cliente.nome }}</strong>.
    </p>
    <p class="text-sm text-slate-300 mt-2">
      Para confirmar, digite <strong class="text-red-300">EXCLUIR</strong> no campo abaixo.
    </p>
  </div>

  <form method="post" class="space-y-3">
    {% csrf_token %}

    <input name="confirm"
           placeholder='Digite "EXCLUIR"'
           class="w-full px-4 py-2 rounded-xl bg-slate-900/60 border border-white/10
                  text-slate-100 placeholder:text-slate-500
                  focus:outline-none focus:ring-2 focus:ring-red-500/40 focus:border-red-500/40 transition" />

    <div class="flex gap-2">
      <button class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 transition font-medium">
        Excluir
      </button>

      <a href="{% url 'clientes:detail' cliente.id %}"
         class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 transition">
        Cancelar
      </a>
    </div>
  </form>

</div>
{% endblock %}
